<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Number Sanctuary</title>
<script src="ui-scale.js"></script>
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="starhermit-sdk.js"></script>
<script type="module" src="./main.js?v=production-qa-1"></script>
<script src="browser-guard.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="title-row">
      <h1 class="title" data-i18n="app.title">Number Sanctuary</h1>
      <span id="fps-meter" class="fps-meter" aria-hidden="true" hidden></span>
      <button type="button" id="settings-btn" class="settings-btn" aria-haspopup="dialog" data-i18n="settings.button">Settings</button>
    </div>
    <div class="modes" role="tablist" aria-label="Game modes" data-i18n-aria-label="aria.modes">
      <button data-mode="learn" class="mode-btn active" role="tab" aria-selected="true" data-i18n="mode.learn">Learn</button>
      <button data-mode="journey" class="mode-btn" role="tab" aria-selected="false" tabindex="-1" data-i18n="mode.journey">Journey</button>
      <button data-mode="daily" class="mode-btn" role="tab" aria-selected="false" tabindex="-1" data-i18n="mode.daily">Daily</button>
      <button data-mode="practice" class="mode-btn" role="tab" aria-selected="false" tabindex="-1" data-i18n="mode.practice">Practice</button>
      <button data-mode="challenge" class="mode-btn" role="tab" aria-selected="false" tabindex="-1" data-i18n="mode.challenge">Challenge</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="scene-canvas" aria-hidden="true"></canvas>
    <section class="panel left-panel" aria-label="Status and progress" data-i18n-aria-label="aria.statusPanel">
      <h2 data-i18n="panel.status">Status</h2>
      <p id="status-text" aria-live="polite" data-i18n="status.ready">Ready.</p>
      <p id="cell-readout" class="readout" aria-live="polite" data-i18n="cell.none">No cell selected.</p>
      <p id="player-line" class="readout" hidden><span id="player-name"></span> · <span id="sync-status"></span></p>
      <div class="progress-wrap">
        <span class="progress-label" id="progress-label" data-i18n="panel.progress">Progress</span>
        <div class="bar" id="progress-bar" role="progressbar" aria-labelledby="progress-label"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
      </div>
    </section>

    <section class="panel right-panel" aria-label="Controls and info" data-i18n-aria-label="aria.controlsPanel">
      <h2 data-i18n="panel.controls">Controls</h2>
      <div id="number-pad" class="pad" role="group" aria-label="Number pad" data-i18n-aria-label="aria.numberPad">
        <button type="button" class="pad-btn" data-digit="1">1</button>
        <button type="button" class="pad-btn" data-digit="2">2</button>
        <button type="button" class="pad-btn" data-digit="3">3</button>
        <button type="button" class="pad-btn" data-digit="4">4</button>
        <button type="button" class="pad-btn" data-digit="5">5</button>
        <button type="button" class="pad-btn" data-digit="6">6</button>
        <button type="button" class="pad-btn" data-digit="7">7</button>
        <button type="button" class="pad-btn" data-digit="8">8</button>
        <button type="button" class="pad-btn" data-digit="9">9</button>
        <button type="button" class="pad-btn wide" data-action="erase" aria-label="Erase selected cell" data-i18n-aria-label="aria.erase" data-i18n="btn.erase">Erase</button>
      </div>
      <div class="actions">
        <button type="button" class="action-btn" data-action="note" aria-pressed="false" data-i18n="btn.mark">Mark (N)</button>
        <button type="button" class="action-btn" data-action="hint" data-i18n="btn.hint">Hint (H)</button>
        <button type="button" class="action-btn" data-action="clear" data-i18n="btn.clear">Clear (C)</button>
        <button type="button" class="action-btn" data-action="restart" data-i18n="btn.restart">Restart (R)</button>
        <button type="button" class="action-btn" data-action="pause" data-i18n="btn.pause">Pause (P)</button>
        <button type="button" class="action-btn" data-action="mute" aria-pressed="false" data-i18n="btn.mute">Mute (M)</button>
      </div>
      <ul class="info-list">
        <li data-i18n="info.select">Click a cell (or use the arrow keys), then a number.</li>
        <li data-i18n="info.colors">Orange tiles are fixed clues; green tiles are yours.</li>
      </ul>
    </section>

    <div id="overlay" class="overlay hidden" role="status" aria-live="polite"></div>
    <div id="sh-toast" class="sh-toast" role="status" aria-live="polite" hidden></div>
  </main>

  <div id="settings" class="settings-backdrop" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title" data-i18n="settings.title">Settings</h2>
        <button type="button" id="settings-close" class="action-btn" data-i18n="settings.close">Close</button>
      </div>
      <section id="account-section" class="gfx-section account-section" aria-labelledby="account-heading" hidden>
        <h3 id="account-heading" data-i18n="account.title">Account</h3>
        <p id="account-hint" class="account-hint" data-i18n="account.signInHint" hidden>Sign in to sync your progress and settings.</p>
        <button type="button" id="sh-sign-in" class="action-btn" data-i18n="account.signIn" hidden>Sign in with StarHermit</button>
        <button type="button" id="sh-invite" class="action-btn" data-i18n="account.invite" hidden>Invite a friend</button>
      </section>
      <section id="gfx-section" class="gfx-section" aria-labelledby="gfx-heading"></section>
    </div>
  </div>
</div>
</body>
</html>
